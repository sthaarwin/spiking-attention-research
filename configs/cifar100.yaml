# CIFAR-100 Generalization Experiment Configuration
model:
  attn_type: "proposed"
  embed_dim: 64
  depth: 2
  num_heads: 4
  T: 4
  img_size: 32
  patch_size: 4
  num_classes: 100
  tau: 2.0
  adaptive: true
  initial_alpha: 1.0
  initial_beta: 1.0
  mlp_ratio: 4.0

dataset:
  name: "cifar100"
  data_dir: "./data"
  batch_size: 64
  num_workers: 2

training:
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  seed: 42
  deterministic: true
